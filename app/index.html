<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Cyberspace Terminal</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* No pointer over the tube. The fault report below keeps one. dvh, not vh:
       on iOS Safari 100vh includes the strip under the toolbar, which cut the
       bottom bezel off. */
    #tube { width: 100vw; height: 100dvh; display: block; cursor: none; }
    #fault {
      display: none; color: #9f9; background: #000; font: 14px/1.5 monospace;
      padding: 2em; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="tube"></canvas>
  <pre id="fault"></pre>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
